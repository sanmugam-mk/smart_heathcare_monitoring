<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediChart — Medical Documents Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F5F9;
    --surface: #FFFFFF;
    --ink: #0F172A;
    --muted: #64748B;
    --primary: #0F6E5F;
    --primary-dark: #0A5247;
    --border: #E2E8F0;
    --danger: #EF4444;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--ink); }

  .navbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 32px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #0F6E5F 0%, #14B8A6 100%);
    border-radius: 9px; color: white; display: flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px;
  }
  .navbar h1 { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; margin: 0; }

  .container { max-width: 800px; margin: 32px auto; padding: 0 24px; }
  a.back { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 16px; }
  a.back:hover { text-decoration: underline; }

  .card {
    background: var(--surface); border-radius: 14px;
    border: 1px solid var(--border); padding: 24px;
    box-shadow: var(--shadow); margin-bottom: 24px;
  }
  .upload-box {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 24px; text-align: center; background: #F8FAFC;
  }
  input[type=file] { margin-bottom: 16px; font-size: 13px; }
  .btn-upload {
    background: var(--primary); color: white; border: none;
    padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Outfit', sans-serif;
  }
  .btn-upload:hover { background: var(--primary-dark); }

  .doc-list { list-style: none; padding: 0; margin: 0; }
  .doc-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 10px; background: var(--surface);
  }
  .doc-info { display: flex; align-items: center; gap: 12px; }
  .doc-badge {
    width: 36px; height: 36px; border-radius: 8px;
    background: #E6F4F1; color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px;
  }
  .doc-name { font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; }
  .doc-name:hover { color: var(--primary); text-decoration: underline; }
  .btn-delete { color: var(--danger); font-size: 13px; font-weight: 600; text-decoration: none; }

  #errorMsg { color: var(--danger); font-size: 13px; margin: 10px 0; font-weight:600; }
  #statusMsg { color: var(--primary); font-size: 13px; margin: 10px 0; font-weight:600; }
</style>
</head>
<body>
  <div class="navbar">
    <div class="logo">MC</div>
    <h1>Medical Documents Vault</h1>
  </div>

  <div class="container">
    <a class="back" href="dashboard.html">← Back to Healthcare Dashboard</a>

    <div class="card">
      <h2 id="pageTitle" style="font-family:'Outfit',sans-serif;margin:0 0 6px;font-size:20px;">Patient Documents</h2>
      <p style="color:var(--muted);font-size:13px;margin:0 0 20px;">Secure presigned S3 document storage for clinical attachments & lab reports.</p>

      <div class="upload-box">
        <input type="file" id="fileInput"><br>
        <button class="btn-upload" onclick="uploadDocument()">Upload Document to S3</button>
      </div>

      <p id="statusMsg"></p>
      <p id="errorMsg"></p>
    </div>

    <div class="card">
      <h3 style="font-size:15px;font-weight:700;margin:0 0 16px;">Uploaded Patient Attachments</h3>
      <ul class="doc-list" id="docList"></ul>
      <p id="emptyState" style="color:var(--muted);font-size:13px;text-align:center;display:none;padding:20px 0;">No documents attached to this patient record yet.</p>
    </div>
  </div>

  <script>
    const API_BASE = "https://sf4pw8iev0.execute-api.ap-south-1.amazonaws.com/dev";
    const token = sessionStorage.getItem("idToken");
    const COGNITO_CLIENT_ID = "5ok9ten25r2dgh9u5q2omuihml";
    let refreshPromise = null;
    const params = new URLSearchParams(window.location.search);
    const patientId = params.get("PatientId");

    if (!token) window.location.href = "index.html";
    if (!patientId) window.location.href = "dashboard.html";

    document.getElementById("pageTitle").textContent = `Medical Vault — Patient: ${patientId}`;

    function getUserGroups() {
      try {
        const payloadPart = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        const payload = JSON.parse(atob(payloadPart));
        return payload["cognito:groups"] || [];
      } catch { return []; }
    }
    const isAdmin = getUserGroups().includes("admin");

    async function refreshIdToken() {
      if (refreshPromise) return refreshPromise;
      const refreshToken = sessionStorage.getItem("refreshToken");
      if (!refreshToken) {
        sessionStorage.removeItem("idToken");
        window.location.href = "index.html";
        throw new Error("Your session expired. Please sign in again.");
      }
      refreshPromise = (async () => {
        const res = await fetch("https://cognito-idp.ap-south-1.amazonaws.com/", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-amz-json-1.1",
            "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth"
          },
          body: JSON.stringify({
            AuthFlow: "REFRESH_TOKEN_AUTH",
            ClientId: COGNITO_CLIENT_ID,
            AuthParameters: { REFRESH_TOKEN: refreshToken }
          })
        });
        const data = await res.json();
        if (!res.ok || !data.AuthenticationResult?.IdToken) {
          throw new Error(data.message || data.Message || "Session refresh failed. Please sign in again.");
        }
        sessionStorage.setItem("idToken", data.AuthenticationResult.IdToken);
        return data.AuthenticationResult.IdToken;
      })();
      try {
        return await refreshPromise;
      } catch (err) {
        sessionStorage.removeItem("idToken");
        sessionStorage.removeItem("refreshToken");
        window.location.href = "index.html";
        throw err;
      } finally {
        refreshPromise = null;
      }
    }

    async function apiFetch(url, options = {}) {
      let currentToken = sessionStorage.getItem("idToken");
      if (!currentToken) {
        window.location.href = "index.html";
        throw new Error("Sign in is required.");
      }
      const send = jwt => fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          "Authorization": `Bearer ${jwt}`,
          "Content-Type": "application/json"
        }
      });
      let res = await send(currentToken);
      if (res.status === 401) {
        currentToken = await refreshIdToken();
        res = await send(currentToken);
      }
      return res;
    }

    async function getApiError(res) {
      try {
        const data = await res.clone().json();
        if (data.error || data.message) return data.error || data.message;
      } catch {}
      if (res.status === 401) return "Session expired or invalid. Please sign in again.";
      if (res.status === 403) return "You do not have permission to perform this action.";
      return `Request failed (HTTP ${res.status})`;
    }

    function getExt(name) {
      const parts = name.split(".");
      return parts.length > 1 ? parts.pop().toUpperCase().slice(0, 3) : "FILE";
    }

    async function loadDocuments() {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = "";

      try {
        const res = await apiFetch(`${API_BASE}/documents?action=list&PatientId=${encodeURIComponent(patientId)}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || await getApiError(res));

        const docList = document.getElementById("docList");
        docList.innerHTML = "";
        const docs = data.documents || [];
        document.getElementById("emptyState").style.display = docs.length ? "none" : "block";
        docs.forEach(doc => addToList(doc.Filename, doc.S3Key, doc.DocumentId));
      } catch (err) { errorMsg.textContent = "Network error: " + err.message; }
    }

    async function uploadDocument() {
      const statusMsg = document.getElementById("statusMsg");
      const errorMsg = document.getElementById("errorMsg");
      statusMsg.textContent = ""; errorMsg.textContent = "";

      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return alert("Please select a file first");

      try {
        const contentType = file.type || "application/octet-stream";
        const urlRes = await apiFetch(
          `${API_BASE}/documents?action=upload-url&PatientId=${encodeURIComponent(patientId)}&filename=${encodeURIComponent(file.name)}&contentType=${encodeURIComponent(contentType)}`
        );
        const urlData = await urlRes.json();
        if (!urlRes.ok) throw new Error(urlData.error || await getApiError(urlRes));

        const formData = new FormData();
        Object.entries(urlData.fields).forEach(([name, value]) => formData.append(name, value));
        formData.append("file", file);
        const uploadRes = await fetch(urlData.upload_url, { method: "POST", body: formData });
        if (!uploadRes.ok) {
          const errorBody = await uploadRes.text();
          const errorCode = errorBody.match(/<Code>([^<]*)<\/Code>/i)?.[1];
          const errorMessage = errorBody.match(/<Message>([^<]*)<\/Message>/i)?.[1];
          errorMsg.textContent = `Direct S3 upload failed (HTTP ${uploadRes.status}${errorCode ? `, ${errorCode}` : ""})${errorMessage ? `: ${errorMessage}` : ""}`;
          return;
        }

        statusMsg.textContent = `Uploaded ${file.name} successfully`;
        document.getElementById("emptyState").style.display = "none";
        addToList(file.name, urlData.key, urlData.document_id);
        fileInput.value = "";
      } catch (err) { errorMsg.textContent = "Upload error: " + err.message; }
    }

    function addToList(filename, key, documentId) {
      const li = document.createElement("li");
      li.className = "doc-item";
      const info = document.createElement("div");
      info.className = "doc-info";
      const badge = document.createElement("div");
      badge.className = "doc-badge";
      badge.textContent = getExt(filename);
      const name = document.createElement("a");
      name.className = "doc-name";
      name.href = "#";
      name.textContent = filename;
      name.onclick = event => {
        event.preventDefault();
        downloadDocument(key);
      };
      info.append(badge, name);
      li.appendChild(info);
      if (isAdmin) {
        const remove = document.createElement("a");
        remove.className = "btn-delete";
        remove.href = "#";
        remove.textContent = "Delete";
        remove.onclick = event => {
          event.preventDefault();
          deleteDocument(documentId, key, li);
        };
        li.appendChild(remove);
      }
      document.getElementById("docList").appendChild(li);
    }

    async function downloadDocument(key) {
      try {
        const res = await apiFetch(`${API_BASE}/documents?action=download-url&key=${encodeURIComponent(key)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || await getApiError(res));
        if (data.download_url) window.open(data.download_url, "_blank", "noopener");
      } catch (err) { alert("Download error: " + err.message); }
    }

    async function deleteDocument(documentId, key, itemEl) {
      if (!confirm("Delete this document attachment?")) return;
      try {
        const res = await apiFetch(
          `${API_BASE}/documents?DocumentId=${encodeURIComponent(documentId)}&key=${encodeURIComponent(key)}`,
          { method: "DELETE" }
        );
        if (!res.ok) throw new Error(await getApiError(res));
        if (res.ok) {
          itemEl.remove();
          if (!document.getElementById("docList").children.length) {
            document.getElementById("emptyState").style.display = "block";
          }
        }
      } catch (err) { alert("Delete error: " + err.message); }
    }

    loadDocuments();
  </script>
</body>
</html>
