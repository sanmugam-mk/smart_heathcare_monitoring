<html lang="en">
<head>

  <meta name="theme-color" content="#0f6e5f">
  <title>Sign in | MediChart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="login-page">

    <div class="brand-mark" aria-hidden="true">M</div>
